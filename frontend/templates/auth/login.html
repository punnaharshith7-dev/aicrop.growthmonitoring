<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — AI Crop Growth Monitoring</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #06170e 0%, #0a2215 50%, #0d2818 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 80% 20%, rgba(34, 197, 94, 0.15) 0%, transparent 40%),
                  radial-gradient(circle at 20% 80%, rgba(132, 204, 22, 0.1) 0%, transparent 40%);
      pointer-events: none;
    }
    .auth-card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
      width: 100%;
      max-width: 440px;
      padding: 44px 38px;
      position: relative;
      z-index: 2;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .brand-badge {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #22c55e, #15803d);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: #fff;
      margin: 0 auto 16px;
      box-shadow: 0 6px 20px rgba(34, 197, 94, 0.35);
    }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="text-center mb-4">
    <div class="brand-badge">🌱</div>
    <h1 class="fs-3 fw-bold mb-1">AI Crop Monitor</h1>
    <p class="text-muted" style="font-size:0.875rem;">Precision Agriculture & Crop Telemetry</p>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} mb-3 py-2 px-3" style="font-size:0.825rem;">
          <i class="bi bi-info-circle me-1"></i> {{ message|safe }}
          <button class="alert-close" onclick="this.parentElement.remove()">×</button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
    <div class="form-group mb-3">
      <label class="form-label">Username or Email</label>
      <div class="input-group">
        <span class="input-group-icon"><i class="bi bi-person"></i></span>
        <input type="text" id="identifier" name="identifier" class="form-control"
               value="{{ identifier or '' }}"
               placeholder="farmer_user or email@farm.com" required autocomplete="username">
      </div>
    </div>

    <div class="form-group mb-3">
      <div class="d-flex justify-content-between align-items-center mb-1">
        <label class="form-label mb-0">Password</label>
        <a href="{{ url_for('auth.forgot_password') }}" style="font-size:0.8rem;font-weight:600;">Forgot password?</a>
      </div>
      <div class="input-group">
        <span class="input-group-icon"><i class="bi bi-shield-lock"></i></span>
        <input type="password" id="password" name="password" class="form-control" placeholder="Enter account password" required autocomplete="current-password">
        <button type="button" class="btn btn-link position-absolute end-0 top-50 translate-middle-y pe-3 text-muted text-decoration-none" onclick="togglePassword(this)" style="z-index:5;">
          <i class="bi bi-eye"></i>
        </button>
      </div>
    </div>

    <div class="d-flex align-items-center gap-2 mb-4">
      <input type="checkbox" id="remember" name="remember" style="width:16px;height:16px;accent-color:#16a34a;">
      <label for="remember" class="text-secondary mb-0" style="font-size:0.85rem;cursor:pointer;">Keep me signed in on this device</label>
    </div>

    <button type="submit" class="btn btn-primary btn-lg w-100">
      <i class="bi bi-box-arrow-in-right"></i> Sign In to Dashboard
    </button>
  </form>

  <div class="text-center mt-4 pt-3 border-top" style="font-size:0.85rem;color:var(--text-muted);">
    Need a new farm account? <a href="{{ url_for('auth.register') }}" class="fw-bold">Register Here</a>
  </div>
</div>

<script>
function togglePassword(btn) {
  const input = document.getElementById('password');
  if (input.type === 'password') {
    input.type = 'text';
    btn.innerHTML = '<i class="bi bi-eye-slash"></i>';
  } else {
    input.type = 'password';
    btn.innerHTML = '<i class="bi bi-eye"></i>';
  }
}
</script>
</body>
</html>
