<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — AI Crop Growth Monitoring</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #06170e 0%, #0a2215 50%, #0d2818 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }
    .auth-card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
      width: 100%;
      max-width: 440px;
      padding: 44px 38px;
      position: relative;
      z-index: 2;
    }
    .brand-badge {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #22c55e, #15803d);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      color: #fff;
      margin: 0 auto 14px;
    }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="text-center mb-4">
    <div class="brand-badge">🔑</div>
    <h1 class="fs-4 fw-bold mb-1">Set New Password</h1>
    <p class="text-muted" style="font-size:0.875rem;">Create a secure password for your account</p>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} mb-3 py-2 px-3" style="font-size:0.825rem;">
          <i class="bi bi-info-circle me-1"></i> {{ message|safe }}
          <button class="alert-close" onclick="this.parentElement.remove()">×</button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
    <div class="form-group mb-3">
      <label class="form-label">New Password</label>
      <div class="input-group">
        <span class="input-group-icon"><i class="bi bi-lock"></i></span>
        <input type="password" name="password" class="form-control" placeholder="At least 6 characters" required autocomplete="new-password">
      </div>
    </div>

    <div class="form-group mb-4">
      <label class="form-label">Confirm New Password</label>
      <div class="input-group">
        <span class="input-group-icon"><i class="bi bi-shield-check"></i></span>
        <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter password" required autocomplete="new-password">
      </div>
    </div>

    <button type="submit" class="btn btn-primary btn-lg w-100">
      <i class="bi bi-check2-circle"></i> Update Password & Sign In
    </button>
  </form>
</div>

</body>
</html>
